[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "django-shop"
version = "0.1.0"
description = "A small typed Django shop."
requires-python = ">=3.14"
dependencies = ["Django>=6.1,<6.2", "django-ninja>=1.7,<1.8"]

[tool.setuptools.packages.find]
include = ["config*", "customer*", "product*", "order*", "newsletter*"]

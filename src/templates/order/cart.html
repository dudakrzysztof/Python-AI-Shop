{% extends "base.html" %}{% block content %}<h1>Your cart</h1>{% for row in rows %}<div class="cart-row"><span>{{ row.product.name }} × {{ row.quantity }}</span><strong>${{ row.subtotal }}</strong></div>{% empty %}<p>Your cart is empty.</p>{% endfor %}{% if rows %}<p class="total">Total: ${{ total }}</p><a class="button" href="{% url 'checkout' %}">Checkout</a>{% endif %}{% endblock %}
